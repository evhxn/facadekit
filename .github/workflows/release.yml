name: Release
on:
  push:
    tags: ["v*"]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install && pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: studio/backend/src/facadekit/webdist
          include-hidden-files: true

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: studio/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: studio/backend/src/facadekit/webdist
      # No `ai` extra: librosa/numba are too large and fragile to freeze. onnxruntime is added.
      - run: uv sync --python 3.13
      - run: uv pip install onnxruntime pyinstaller pip-licenses
      - name: Third-party notices
        run: >
          uv run --no-sync pip-licenses --format=plain-vertical --with-license-file
          --no-license-path --output-file ../../THIRD_PARTY_NOTICES.txt
      - name: Freeze
        run: uv run --no-sync pyinstaller ../../packaging/facadekit.spec --noconfirm --distpath ../../dist --workpath ../../build
      - name: Locate frozen app
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "FK_EXE=$GITHUB_WORKSPACE/dist/FacadeKit/FacadeKit.exe" >> "$GITHUB_ENV"
          else
            echo "FK_EXE=$GITHUB_WORKSPACE/dist/FacadeKit.app/Contents/MacOS/FacadeKit" >> "$GITHUB_ENV"
          fi
      - name: Smoke test
        run: uv run --no-sync python ../../packaging/smoke_test.py "$FK_EXE"
      - name: Zip
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path FacadeKit -DestinationPath FacadeKit-${{ matrix.name }}.zip"
          else
            ditto -c -k --keepParent FacadeKit.app "FacadeKit-${{ matrix.name }}.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FacadeKit-${{ matrix.name }}
          path: dist/FacadeKit-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web for the wheel
        run: pnpm install && pnpm build
        working-directory: studio/web
      - name: Build wheel and sdist
        run: uv build --out-dir ../../release
        working-directory: studio/backend
      - uses: actions/download-artifact@v4
        with:
          pattern: FacadeKit-*
          path: release
          merge-multiple: true
      - name: SHA-256 sums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

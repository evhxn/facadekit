name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        # Full OS matrix only on main pushes and manual runs; macOS (10x) and
        # Windows (2x) minutes are expensive on private repos.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studio/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install && pnpm lint && pnpm typecheck && pnpm test
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv sync --all-extras
        working-directory: studio/backend
      - run: pnpm install && pnpm build && pnpm exec playwright install --with-deps chromium
        working-directory: studio/web
      - run: pnpm e2e
        working-directory: studio/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-results
          path: studio/web/test-results
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
